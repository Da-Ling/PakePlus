<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6bff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<title>艾宾浩斯复习提醒</title>

<!-- ===== PWA / 添加到主屏幕 ===== -->
<meta name="description" content="基于艾宾浩斯记忆曲线的复习提醒工具，数据保存在本机浏览器。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="艾宾浩斯复习">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --text:#14181f; --muted:#6b7280;
    --line:#e6e9ee; --brand:#2f6bff; --brand-soft:#e9f0ff;
    --danger:#e5484d; --danger-soft:#fdecec; --ok:#12a150;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.06);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1116; --card:#161b22; --text:#e6e9ee; --muted:#98a2b3;
      --line:#232a33; --brand:#5b8cff; --brand-soft:#16233d;
      --danger:#ff6b6b; --danger-soft:#3a1c1e; --ok:#3ecf8e;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 14px;min-width:0}

  /* ---------- 顶部 ---------- */
  header.top{
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 0 12px;
  }
  .clockbar{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:10px; margin-bottom:10px;
  }
  .clock{
    font-variant-numeric:tabular-nums;
    font-size:19px; font-weight:650; letter-spacing:.2px;
  }
  .clock small{
    display:block; font-size:11px; font-weight:500; color:var(--muted);
    letter-spacing:.06em; text-transform:uppercase; margin-top:1px;
  }
  .stats{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}

  .newbar{display:flex; gap:8px; align-items:stretch}
  .newbar input{
    flex:1 1 0; width:0; min-width:0;
    padding:12px 14px; font-size:15px; color:var(--text);
    background:var(--card); border:1px solid var(--line);
    border-radius:12px; outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .newbar input::placeholder{color:var(--muted)}
  .newbar input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .newbar button{
    flex:0 0 auto; padding:12px 18px; font-size:15px; font-weight:600;
    color:#fff; background:var(--brand); border:0; border-radius:12px;
    cursor:pointer; transition:transform .08s, filter .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .newbar button:hover{filter:brightness(1.05)}
  .newbar button:active{transform:scale(.97)}

  /* ---------- 列表 ---------- */
  main{padding-top:16px}
  .list{display:grid; gap:14px; grid-template-columns:minmax(0,1fr)}
  @media (min-width:760px){ .list{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }

  .card{
    min-width:0;
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow);
    padding:14px 14px 8px; overflow:hidden;
    transition:opacity .2s, transform .2s;
  }
  .card.is-done{opacity:.5}
  .card.is-done .title{text-decoration:line-through; text-decoration-thickness:1px}

  .card-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:10px}
  .card-head .titles{flex:1 1 auto; min-width:0}
  .title{
    margin:0; font-size:17px; font-weight:650; line-height:1.35;
    word-break:break-word;
  }
  .meta{margin-top:3px; font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  .badge{
    font-size:11px; font-weight:600; padding:1px 7px; border-radius:999px;
    color:var(--ok); background:color-mix(in srgb, var(--ok) 14%, transparent);
  }
  .del{
    flex:0 0 auto; border:0; background:transparent; color:var(--muted);
    font-size:13px; padding:6px 4px; cursor:pointer; border-radius:8px;
    -webkit-tap-highlight-color:transparent;
  }
  .del:hover{color:var(--danger); background:var(--danger-soft)}

  .progress{height:4px;border-radius:999px;background:var(--line);overflow:hidden;margin:0 0 10px}
  .progress i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}

  ul.reviews{list-style:none;margin:0;padding:0}
  li.review{
    display:flex; align-items:center; gap:10px;
    padding:9px 2px; border-top:1px solid var(--line);
  }
  li.review:first-child{border-top:0}

  label.chk{display:flex; align-items:center; gap:10px; cursor:pointer; flex:1 1 auto; min-width:0}
  label.chk input{position:absolute; opacity:0; width:0; height:0}
  .box{
    flex:0 0 auto; width:21px; height:21px; border-radius:7px;
    border:1.5px solid color-mix(in srgb, var(--muted) 55%, transparent);
    display:grid; place-items:center; transition:all .15s;
  }
  .box::after{
    content:""; width:10px; height:6px;
    border-left:2px solid #fff; border-bottom:2px solid #fff;
    transform:rotate(-45deg) scale(.4); opacity:0; transition:all .15s;
    margin-top:-2px;
  }
  label.chk input:checked + .box{background:var(--ok); border-color:var(--ok)}
  label.chk input:checked + .box::after{opacity:1; transform:rotate(-45deg) scale(1)}
  label.chk input:focus-visible + .box{box-shadow:0 0 0 3px var(--brand-soft)}

  .rlabel{font-size:14px; font-weight:600; white-space:nowrap}
  .rtime{
    flex:0 0 auto; text-align:right; font-size:12px; color:var(--muted);
    font-variant-numeric:tabular-nums; line-height:1.35;
  }
  .rtime em{display:block; font-style:normal; font-size:11px}

  /* 已复习 */
  li.review.on .rlabel{text-decoration:line-through; color:var(--muted); font-weight:500}
  li.review.on .rtime{opacity:.6}

  /* 逾期未完成 */
  li.review.due{
    background:var(--danger-soft);
    margin:0 -14px; padding-left:16px; padding-right:14px;
    border-radius:8px;
  }
  li.review.due .rlabel{color:var(--danger)}
  li.review.due .rtime{color:var(--danger); font-weight:600}
  li.review.due .box{border-color:var(--danger)}

  .empty{
    text-align:center; color:var(--muted); padding:56px 20px;
    border:1px dashed var(--line); border-radius:var(--radius);
    background:color-mix(in srgb, var(--card) 60%, transparent);
  }
  .empty b{display:block; color:var(--text); font-size:16px; margin-bottom:6px}
  .empty span{display:block; font-size:13px; line-height:1.7; word-break:break-word}

  footer{color:var(--muted); font-size:12px; text-align:center; padding:22px 0 8px}
  .hidden{display:none !important}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="clockbar">
      <div>
        <div class="clock" id="clock">----</div>
        <small>北京时间</small>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="newbar">
      <input id="title" type="text" placeholder="新建学习主题，例如：考研物理" autocomplete="off" maxlength="40">
      <button id="add" type="button">生成计划</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="list" id="list"></div>
  <div class="empty" id="empty">
    <b>还没有任何复习计划</b>
    <span>在上方输入学习主题，点击「生成计划」<br>系统会按 5分钟 / 30分钟 / 12小时 / 1天 / 2天 / 4天 / 7天 / 15天 自动排好复习时间</span>
  </div>
  <footer id="footer"></footer>
</main>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "ebbinghaus.reminder.v1";

  // 艾宾浩斯复习间隔
  var INTERVALS = [
    { label: "5分钟",  ms: 5 * 60 * 1000 },
    { label: "30分钟", ms: 30 * 60 * 1000 },
    { label: "12小时", ms: 12 * 60 * 60 * 1000 },
    { label: "1天",    ms: 1 * 24 * 60 * 60 * 1000 },
    { label: "2天",    ms: 2 * 24 * 60 * 60 * 1000 },
    { label: "4天",    ms: 4 * 24 * 60 * 60 * 1000 },
    { label: "7天",    ms: 7 * 24 * 60 * 60 * 1000 },
    { label: "15天",   ms: 15 * 24 * 60 * 60 * 1000 }
  ];

  var state = { plans: [] };
  var lastSig = "";
  var lastMinute = -1;

  /* ---------------- 北京时间 ---------------- */
  var clockFmt = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Shanghai",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
    hour12: false, hourCycle: "h23"
  });

  function parts(ts) {
    var out = {};
    var arr = clockFmt.formatToParts(new Date(ts));
    for (var i = 0; i < arr.length; i++) out[arr[i].type] = arr[i].value;
    return out;
  }

  function beijingClock(ts) {
    var p = parts(ts);
    return p.year + "-" + p.month + "-" + p.day + " " +
           p.hour + ":" + p.minute + ":" + p.second;
  }

  function beijingShort(ts) {
    var p = parts(ts);
    return p.month + "-" + p.day + " " + p.hour + ":" + p.minute;
  }

  /* ---------------- 相对时间 ---------------- */
  function relative(ts, now) {
    var d = ts - now;
    var a = Math.abs(d);
    var text;

    if (a < 60 * 1000) text = Math.round(a / 1000) + " 秒";
    else if (a < 60 * 60 * 1000) text = Math.round(a / 60000) + " 分钟";
    else if (a < 24 * 60 * 60 * 1000) text = (a / 3600000).toFixed(1) + " 小时";
    else text = Math.round(a / 86400000) + " 天";

    return d >= 0 ? text + "后" : "逾期 " + text;
  }

  /* ---------------- 存储 ---------------- */
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (data && Array.isArray(data.plans)) {
        state.plans = data.plans.filter(function (p) {
          return p && typeof p.id === "string" && Array.isArray(p.reviews);
        });
      }
    } catch (e) {
      console.warn("读取本地数据失败：", e);
      state.plans = [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      alert("本地保存失败，可能是浏览器存储空间已满或被禁用。");
    }
  }

  /* ---------------- 工具 ---------------- */
  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "p_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function completedCount(plan) {
    var n = 0;
    for (var i = 0; i < plan.reviews.length; i++) if (plan.reviews[i].completed) n++;
    return n;
  }

  function isDone(plan) {
    return plan.reviews.length > 0 && completedCount(plan) === plan.reviews.length;
  }

  function nextPending(plan) {
    var min = Infinity;
    for (var i = 0; i < plan.reviews.length; i++) {
      var r = plan.reviews[i];
      if (!r.completed && r.time < min) min = r.time;
    }
    return min;
  }

  function sortedPlans() {
    return state.plans.slice().sort(function (a, b) {
      var ad = isDone(a), bd = isDone(b);
      if (ad !== bd) return ad ? 1 : -1;          // 全部完成 → 排到最后
      if (!ad) {
        var an = nextPending(a), bn = nextPending(b);
        if (an !== bn) return an - bn;            // 快到期 / 逾期最久的在前
        return b.createdAt - a.createdAt;
      }
      return b.createdAt - a.createdAt;
    });
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    var now = Date.now();
    var plans = sortedPlans();
    var list = document.getElementById("list");
    var empty = document.getElementById("empty");
    var stats = document.getElementById("stats");
    var footer = document.getElementById("footer");

    if (!plans.length) {
      list.innerHTML = "";
      empty.classList.remove("hidden");
      stats.textContent = "";
      footer.textContent = "";
      return;
    }
    empty.classList.add("hidden");

    var totalPoints = 0, donePoints = 0, dueCount = 0;
    var html = "";

    for (var i = 0; i < plans.length; i++) {
      var p = plans[i];
      var total = p.reviews.length;
      var done = completedCount(p);
      var pct = total ? Math.round(done / total * 100) : 0;
      var allDone = isDone(p);

      totalPoints += total;
      donePoints += done;

      var rows = "";
      for (var j = 0; j < p.reviews.length; j++) {
        var r = p.reviews[j];
        var overdue = !r.completed && now >= r.time;
        if (overdue) dueCount++;

        var cls = "review";
        if (r.completed) cls += " on";
        if (overdue) cls += " due";

        rows += '<li class="' + cls + '">' +
          '<label class="chk">' +
            '<input type="checkbox" data-act="toggle" data-id="' + escapeHtml(p.id) + '" data-i="' + j + '"' +
              (r.completed ? " checked" : "") + '>' +
            '<span class="box" aria-hidden="true"></span>' +
            '<span class="rlabel">' + escapeHtml(r.label) + '</span>' +
          '</label>' +
          '<div class="rtime">' + beijingShort(r.time) +
            '<em>' + (r.completed ? "已完成" : relative(r.time, now)) + '</em>' +
          '</div>' +
        '</li>';
      }

      html += '<article class="card' + (allDone ? " is-done" : "") + '">' +
        '<div class="card-head">' +
          '<div class="titles">' +
            '<h2 class="title">' + escapeHtml(p.title) + '</h2>' +
            '<div class="meta">' +
              '<span>创建于 ' + beijingShort(p.createdAt) + '</span>' +
              '<span>·</span>' +
              '<span>' + done + '/' + total + ' 已复习</span>' +
              (allDone ? '<span class="badge">全部完成</span>' : '') +
            '</div>' +
          '</div>' +
          '<button class="del" type="button" data-act="del" data-id="' + escapeHtml(p.id) + '">删除</button>' +
        '</div>' +
        '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
        '<ul class="reviews">' + rows + '</ul>' +
      '</article>';
    }

    list.innerHTML = html;
    stats.innerHTML = "待复习 <b style=\"color:var(--danger)\">" + dueCount + "</b> 项<br>" +
                      "共 " + plans.length + " 个计划";
    footer.textContent = "共 " + totalPoints + " 个复习点，已完成 " + donePoints + " 个 · 数据保存在本机浏览器";
  }

  /* 每秒刷新时钟；到点/每分钟变化时重绘列表 */
  function tick() {
    var now = Date.now();
    document.getElementById("clock").textContent = beijingClock(now);

    var minute = Math.floor(now / 60000);
    var sig = state.plans.map(function (p) {
      return p.id + ":" + p.reviews.map(function (r) {
        return (r.completed ? "1" : "0") + (now >= r.time ? "D" : "F");
      }).join("");
    }).join("|") + "#" + minute;

    if (sig !== lastSig) {
      lastSig = sig;
      lastMinute = minute;
      render();
    }
  }

  /* ---------------- 交互 ---------------- */
  function addPlan() {
    var input = document.getElementById("title");
    var title = input.value.trim();
    if (!title) {
      input.focus();
      input.style.borderColor = "var(--danger)";
      setTimeout(function () { input.style.borderColor = ""; }, 900);
      return;
    }

    var now = Date.now();
    state.plans.push({
      id: uid(),
      title: title,
      createdAt: now,
      reviews: INTERVALS.map(function (iv) {
        return { label: iv.label, time: now + iv.ms, completed: false };
      })
    });

    input.value = "";
    save();
    lastSig = "";
    render();
  }

  document.getElementById("add").addEventListener("click", addPlan);
  document.getElementById("title").addEventListener("keydown", function (e) {
    if (e.key === "Enter") addPlan();
  });

  document.getElementById("list").addEventListener("change", function (e) {
    var el = e.target;
    if (!el || el.getAttribute("data-act") !== "toggle") return;
    var id = el.getAttribute("data-id");
    var idx = parseInt(el.getAttribute("data-i"), 10);
    for (var i = 0; i < state.plans.length; i++) {
      if (state.plans[i].id === id) {
        var r = state.plans[i].reviews[idx];
        if (r) r.completed = el.checked;
        break;
      }
    }
    save();
    lastSig = "";
    render();
  });

  document.getElementById("list").addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest('[data-act="del"]') : null;
    if (!el) return;
    var id = el.getAttribute("data-id");
    for (var i = 0; i < state.plans.length; i++) {
      if (state.plans[i].id === id) {
        if (!confirm("删除「" + state.plans[i].title + "」及其全部复习记录？")) return;
        state.plans.splice(i, 1);
        break;
      }
    }
    save();
    lastSig = "";
    render();
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { lastSig = ""; tick(); }
  });

  /* ---------------- 启动 ---------------- */
  load();
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
